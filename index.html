<style>
:root{
  --bg: #0a0f1c;
  --bg-panel: #101a2e;
  --bg-panel-hover: #142238;
  --line: #223050;
  --text: #d7e2f2;
  --text-dim: #7b8bab;
  --accent: #4fd1c5;
  --accent-dim: #2b6b66;
  --danger: #ff6b4a;
  --warn: #f2b84b;
  --ok: #63d47a;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-sans: 'IBM Plex Sans', sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);}  
::selection{background:var(--accent);color:#04201d;}

/* ---------- NAV ---------- */
.site-nav{
  max-width:900px;margin:0 auto;padding:18px 24px 0;
  display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;
  font-family:var(--font-mono);font-size:13px;
}
.nav-right{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;}
@media(max-width:520px){
  .site-nav{font-size:12px;padding:14px 16px 0;}
  .nav-right{gap:8px 10px;width:100%;}
  .admin-btn, .mod-btn{font-size:11px;padding:5px 10px;}
}

/* ---------- HERO / BOOT SEQUENCE ---------- */
.hero{
  padding:64px 24px 40px;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(circle at 15% 0%, rgba(79,209,197,0.08), transparent 45%),
    var(--bg);
  position:relative;
}
.boot{
  max-width:760px;margin:0 auto;
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--accent-dim);
  line-height:1.9;
}
.boot span{color:var(--text-dim);}
.boot .ok{color:var(--ok);}
.boot .cursor{
  display:inline-block;width:8px;height:14px;background:var(--accent);
  margin-left:4px;vertical-align:-2px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0;}}

h1.title{
  max-width:760px;margin:22px auto 8px;
  font-family:var(--font-mono);
  font-size:clamp(28px,5vw,44px);
  font-weight:700;
  letter-spacing:-0.5px;
  line-height:1.15;
}
h1.title .bracket{color:var(--accent);} 
p.subtitle{
  max-width:640px;margin:0 auto 32px;
  color:var(--text-dim);font-size:15.5px;line-height:1.6;
}

/* ---------- (styles omitted for brevity) ---------- */
</style>

}

}
